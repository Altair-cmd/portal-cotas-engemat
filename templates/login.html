<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Portal de Cotas</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a3a5c 0%, #0f2540 100%);
    }

    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      max-width: 380px;
      width: 90%;
      text-align: center;
    }

    .card .icon {
      font-size: 3rem;
      margin-bottom: 8px;
      display: block;
    }

    .card h1 {
      font-size: 1.6rem;
      color: #1a3a5c;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .card .sub1 {
      font-size: 0.9rem;
      color: #4a6080;
      margin-bottom: 2px;
      font-weight: 500;
    }

    .card .sub2 {
      font-size: 0.8rem;
      color: #7a90aa;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      color: #4a6080;
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #d0dce8;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      color: #1a3a5c;
      background: #f7fafc;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .form-group input:focus {
      border-color: #1a3a5c;
      box-shadow: 0 0 0 3px rgba(26, 58, 92, 0.12);
      background: #fff;
    }

    .btn-entrar {
      width: 100%;
      padding: 13px;
      background: #1a3a5c;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: background 0.2s, transform 0.1s;
      margin-top: 6px;
    }

    .btn-entrar:hover { background: #0f2540; }
    .btn-entrar:active { transform: scale(0.98); }

    .erro {
      margin-top: 16px;
      padding: 10px 14px;
      background: #fff0f0;
      border: 1px solid #f5c6cb;
      border-radius: 8px;
      color: #b02a37;
      font-size: 0.88rem;
      font-weight: 500;
    }

    .footer-text {
      margin-top: 24px;
      font-size: 0.75rem;
      color: #aac0d5;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">📊</span>
    <h1>Portal de Cotas</h1>
    <p class="sub1">Engenharia de Materiais – ENGEMAT</p>
    <p class="sub2">Jovens Aprendizes e PCDs</p>

    <form action="/login" method="POST">
      <div class="form-group">
        <label for="senha">Senha de acesso</label>
        <input
          type="password"
          id="senha"
          name="senha"
          placeholder="Senha de acesso"
          required
          autocomplete="current-password"
        />
      </div>
      <button type="submit" class="btn-entrar">Entrar</button>
    </form>

    {% if error %}
    <div class="erro">{{ error }}</div>
    {% endif %}

    <p class="footer-text">ENGEMAT &copy; 2026</p>
  </div>
</body>
</html>
